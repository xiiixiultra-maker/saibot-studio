<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>AF1 CAD Colorway Studio</title>
<style>
:root{--bg:#131316;--panel:#1b1b1f;--line:#2d2d34;--txt:#f1f1f3;--muted:#9a9aa5;--acc:#e6007e}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:360px;max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 24px 22px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.brand{font-weight:800;letter-spacing:.14em;font-size:12px;text-transform:uppercase;color:#fff;margin-bottom:6px}
.brand b{color:var(--acc)}
h1{font-size:18px;margin:0 0 4px}
p{color:var(--muted);margin:0 0 18px;font-size:13px}
input[type=password]{width:100%;font:inherit;font-size:16px;color:var(--txt);background:#0f0f12;border:1px solid var(--line);border-radius:9px;padding:11px 12px;letter-spacing:.12em}
input[type=password]:focus{outline:none;border-color:#5a5a66}
button{width:100%;margin-top:10px;font:inherit;font-weight:600;color:#fff;background:var(--acc);border:1px solid var(--acc);border-radius:9px;padding:11px;cursor:pointer}
button:hover{background:#ff1a94}
button:disabled{opacity:.6;cursor:default}
label{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--muted);font-size:12.5px;cursor:pointer}
.err{color:#ff7b7b;font-size:12.5px;min-height:18px;margin-top:10px}
.shake{animation:sh .35s}
@keyframes sh{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.foot{margin-top:16px;font-size:11px;color:#5f5f6a}
</style>
</head>

  const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const $ = id => document.getElementById(id);
  const KEY = 'af1cad.gate';
  async function tryOpen(pass){
    const enc = new TextEncoder();
    const km = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64d(P.salt), iterations:P.iter, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(P.iv)}, key, b64d(P.ct));
    return new TextDecoder().decode(pt);
  }
  function swap(html){ document.open(); document.write(html); document.close(); }
  async function attempt(pass, remember, silent){
    const btn = $('go'); btn.disabled = true; btn.textContent = 'Opening…'; $('err').textContent = '';
    try {
      const html = await tryOpen(pass);
      if(remember){ try { localStorage.setItem(KEY, pass); } catch(e){} }
      swap(html);
    } catch(e){
      btn.disabled = false; btn.textContent = 'Open';
      if(!silent){ $('err').textContent = 'Wrong passcode.'; const c = $('f'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); $('pw').select(); }
      else { try { localStorage.removeItem(KEY); } catch(e){} }
    }
  }
  $('f').addEventListener('submit', e => { e.preventDefault(); const v = $('pw').value.trim(); if(v) attempt(v, $('rem').checked, false); });
  let saved = null; try { saved = localStorage.getItem(KEY); } catch(e){}
  if(saved) attempt(saved, false, true);
})();
