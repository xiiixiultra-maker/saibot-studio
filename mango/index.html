:root{--paper:#F3E9D2;--ink:#23190F;--ink2:#54432F;--ink3:#86725A;--leaf:#2E6A36;--leaf-lo:#245A2C;
 --awn:#F4EBD3;--mango:#F5AF20;--chili:#C33A21;--wood:#9C6534;--wood-lo:#6A401D;--sw:56px}
*{box-sizing:border-box}
html{background:#45290F;overflow-x:hidden}
html,body{margin:0;min-height:100%}
body{min-height:100vh;background:var(--paper);color:var(--ink);
 font:400 15px/1.5 "Apfel Grotezk",ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
 overflow-x:hidden;overflow-x:clip}
.awning{position:relative;z-index:1;height:56px;
 background:linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,0) 45%,rgba(0,0,0,.12)),
  repeating-linear-gradient(90deg,var(--leaf) 0 var(--sw),var(--awn) var(--sw) calc(var(--sw)*2))}
.awning::before{content:"";position:absolute;left:0;right:0;top:0;height:9px;background:#45290F}
.awning::after{content:"";position:absolute;left:0;right:0;top:100%;height:calc(var(--sw)/2);
 background:
  radial-gradient(circle at calc(var(--sw)/2) 0,var(--leaf) calc(var(--sw)/2 - .6px),rgba(0,0,0,0) calc(var(--sw)/2))
   0 0/calc(var(--sw)*2) 100% repeat-x,
  radial-gradient(circle at calc(var(--sw)/2) 0,var(--awn) calc(var(--sw)/2 - .6px),rgba(0,0,0,0) calc(var(--sw)/2))
   var(--sw) 0/calc(var(--sw)*2) 100% repeat-x;
 filter:drop-shadow(0 6px 5px rgba(60,35,10,.28))}
.wrap{display:flex;flex-direction:column;align-items:center;padding:34px 20px 48px}
.door{position:relative;width:250px;height:176px;perspective:900px}
.nail{position:absolute;left:50%;top:0;width:14px;height:14px;margin-left:-7px;border-radius:50%;z-index:3;
 background:radial-gradient(circle at 35% 35%,#b0a697,#3b3228 70%);box-shadow:0 2px 2px rgba(0,0,0,.35)}
.string{position:absolute;left:0;top:0;width:250px;height:70px;z-index:2}
.hang{position:absolute;left:20px;top:52px;width:210px;height:112px;transform-origin:50% -45px;
 animation:sway 4.5s ease-in-out infinite}
.sign{position:relative;width:100%;height:100%;transform-style:preserve-3d;
 transition:transform .62s cubic-bezier(.3,1.35,.5,1)}
.open .sign{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:grid;place-items:center;border-radius:14px;
 border:6px solid var(--wood-lo);backface-visibility:hidden;-webkit-backface-visibility:hidden;
 box-shadow:0 14px 22px -12px rgba(40,22,6,.7),inset 0 2px 0 rgba(255,255,255,.15)}
.face::before{content:"";position:absolute;inset:6px;border:2px solid rgba(243,237,218,.7);border-radius:7px}
.face span{font:700 37px/1 "Basteleur",Georgia,serif;color:var(--awn);text-shadow:.05em .05em 0 rgba(0,0,0,.35)}
.front{background:linear-gradient(180deg,#CF4428,#A5301A)}
.back{background:linear-gradient(180deg,#31703A,var(--leaf-lo));transform:rotateY(180deg)}
.hang::before,.hang::after{content:"";position:absolute;top:10px;width:9px;height:9px;border-radius:50%;
 background:#3b2a1a;z-index:2}
.hang::before{left:18px}.hang::after{right:18px}
@keyframes sway{0%,100%{transform:rotate(1.6deg)}50%{transform:rotate(-1.6deg)}}
.cardwrap{position:relative;isolation:isolate;width:370px;max-width:100%;margin-top:30px}
.card{width:100%;padding:26px 26px 20px;background:#FFFCF2;
 border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.14),0 22px 34px -20px rgba(40,22,6,.6);rotate:-.6deg;
 position:relative}
/* streetwear: paint and halftone behind things, a sticker on top */
.deco{position:absolute;z-index:-1;pointer-events:none;display:block}
.deco svg{display:block;width:100%;height:auto;overflow:visible}
.door .deco{left:50%;top:108px;width:400px;margin:-200px 0 0 -200px}
.cardwrap .ht{right:-120px;bottom:-56px;width:290px;opacity:.42}
.cardwrap .splat{left:-66px;bottom:-46px;width:170px}
.pop{animation:slap .5s .12s cubic-bezier(.2,1.5,.4,1) both}
.deco.go{opacity:0}
.open .deco.go{animation:slap .45s cubic-bezier(.2,1.5,.4,1) both}
@keyframes slap{0%{opacity:0;transform:scale(.3)}55%{opacity:1}100%{opacity:1;transform:scale(1)}}
.hola{position:absolute;right:-18px;top:-30px;z-index:4;rotate:12deg;background:#FFFDF6;color:var(--chili);
 font:700 22px/1 "Basteleur",Georgia,serif;border-radius:999px;border:4px solid var(--ink);
 box-shadow:inset 0 0 0 5px var(--mango),0 5px 0 rgba(35,25,15,.25);padding:14px 10px 11px}
.card::before{content:"";position:absolute;top:-12px;left:50%;width:96px;height:24px;margin-left:-48px;
 background:rgba(232,214,160,.88);rotate:-3deg}
.brand{font-weight:700;font-size:13px;color:var(--leaf);margin-bottom:6px}
h1{font:700 20px/1.2 "Apfel Grotezk",sans-serif;margin:0 0 6px}
p{color:var(--ink2);margin:0 0 18px;font-size:14px}
input[type=password]{width:100%;font:inherit;font-size:18px;color:var(--ink);background:rgba(245,175,32,.1);
 border:0;border-bottom:2px solid var(--ink);border-radius:8px 8px 0 0;padding:12px;letter-spacing:.3em;text-align:center}
input[type=password]:focus{outline:none;background:rgba(245,175,32,.2);border-bottom-color:var(--leaf);
 box-shadow:0 2px 0 var(--leaf)}
button{width:100%;margin-top:14px;min-height:50px;font:700 17px/1 "Apfel Grotezk",sans-serif;color:var(--ink);
 background:var(--mango);border:2px solid var(--ink);border-radius:12px;padding:12px;cursor:pointer;
 box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s}
button:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
button:disabled{opacity:.65;cursor:progress}
label{display:flex;align-items:center;gap:8px;margin-top:14px;color:var(--ink2);font-size:13.5px;cursor:pointer}
label input{width:18px;height:18px;accent-color:var(--leaf)}
.err{color:var(--chili);font-size:14px;min-height:20px;margin-top:10px}
.shake{animation:sh .35s}
@keyframes sh{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}
 60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.foot{margin-top:12px;font-size:12px;color:var(--ink3);line-height:1.5}
@media (prefers-reduced-motion:reduce){.hang{animation:none}.sign{transition:none}
 .pop,.open .deco.go{animation:none}.open .deco.go{opacity:1}}

  <form class="card" id="f" autocomplete="off">
    <span class="hola" aria-hidden="true">&iexcl;Hola!</span>
    <div class="brand">Shoe Gallery</div>
    <h1>Private sample</h1>
    <p>Confidential work in progress. Enter the passcode to open it.</p>
    <input type="password" id="pw" placeholder="Passcode" autofocus autocapitalize="off"
           spellcheck="false" inputmode="numeric" aria-label="Passcode">
    <button id="go" type="submit">Open</button>
    <label><input type="checkbox" id="rem" checked> Remember on this device</label>
    <div class="err" id="err" role="alert"></div>
    <div class="foot">Encrypted at rest. Nothing loads without the code.</div>

<script>
(() => {
  const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const $ = id => document.getElementById(id);
  const KEY = 'mango.gate';
  const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Ciphertext lives in its own file so the gate paints instantly instead of waiting
  // on a few MB of inlined payload. Start pulling it now, in the background, so it is
  // usually already here by the time anyone finishes typing.
  const payload = fetch('payload.json').then(r => {
    if(!r.ok) throw new Error('payload ' + r.status);
    return r.json();
  });
  async function tryOpen(pass){
    const P = await payload;
    const enc = new TextEncoder();
    const km = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b64d(P.salt), iterations:P.iter, hash:'SHA-256'},
      km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(P.iv)}, key, b64d(P.ct));
    return new TextDecoder().decode(pt);
  }
  function swap(html){ document.open(); document.write(html); document.close(); }
  async function attempt(pass, remember, silent){
    const btn = $('go'); btn.disabled = true; btn.textContent = 'Opening'; $('err').textContent = '';
    try {
      const html = await tryOpen(pass);
      if(remember){ try { localStorage.setItem(KEY, pass); } catch(e){} }
      // flip the sign to Abierto, then open the stand
      $('wrap').classList.add('open'); btn.textContent = 'Abierto';
      setTimeout(() => swap(html), still ? 0 : (silent ? 380 : 700));
    } catch(e){
      btn.disabled = false; btn.textContent = 'Open';
      if(!silent){
        $('err').textContent = 'Wrong passcode.';
        const c = $('f'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
        $('pw').select();
      } else { try { localStorage.removeItem(KEY); } catch(e){} }
    }
  }
  $('f').addEventListener('submit', e => {
    e.preventDefault(); const v = $('pw').value.trim(); if(v) attempt(v, $('rem').checked, false);
  });
  let saved = null; try { saved = localStorage.getItem(KEY); } catch(e){}

})();
