<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Ripeness Sample</title>
<style>
:root{--bg:#0b0b0c;--panel:#161617;--line:#2a2a2c;--txt:#f5f5f5;--muted:#8b8b8f;--acc:#F5AF20}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);
 font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:370px;max-width:100%;background:var(--panel);border:1px solid var(--line);
 border-radius:6px;padding:28px 26px 22px;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.ripe{height:6px;border-radius:3px;margin-bottom:20px;
 background:linear-gradient(90deg,#35702B,#A9C33B,#F3C231,#EF8A1B,#A61B17)}
.brand{font-weight:800;letter-spacing:.16em;font-size:11px;text-transform:uppercase;
 color:var(--acc);margin-bottom:10px}
h1{font-size:19px;margin:0 0 6px;letter-spacing:-.2px}
p{color:var(--muted);margin:0 0 18px;font-size:13px}
input[type=password]{width:100%;font:inherit;font-size:16px;color:var(--txt);background:#0f0f11;
 border:1px solid var(--line);border-radius:4px;padding:12px;letter-spacing:.3em;text-align:center}
input[type=password]:focus{outline:none;border-color:var(--acc)}
button{width:100%;margin-top:10px;font:inherit;font-weight:800;letter-spacing:.1em;
 text-transform:uppercase;color:#0b0b0c;background:var(--acc);border:1px solid var(--acc);
 border-radius:4px;padding:12px;cursor:pointer}
button:hover{filter:brightness(1.08)}
button:disabled{opacity:.6;cursor:default}
label{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--muted);
 font-size:12.5px;cursor:pointer}
.err{color:#ff8f7a;font-size:12.5px;min-height:18px;margin-top:10px}
.shake{animation:sh .35s}
@keyframes sh{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}
 60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.foot{margin-top:16px;font-size:11px;color:#5a5a60;line-height:1.5}
</style>
</head>
<body>
<div class="wrap"><form class="card" id="f" autocomplete="off">
  <div class="ripe"></div>
  <div class="brand">Shoe Gallery</div>
  <h1>Private sample</h1>
  <p>Confidential work in progress. Enter the passcode to open it.</p>
  <input type="password" id="pw" placeholder="Passcode" autofocus autocapitalize="off"
         spellcheck="false" inputmode="numeric">
  <button id="go" type="submit">Open</button>
  <label><input type="checkbox" id="rem" checked> Remember on this device</label>
  <div class="err" id="err"></div>
  <div class="foot">Encrypted at rest. Nothing loads without the code.</div>
</form></div>
<script>
(() => {
  const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const $ = id => document.getElementById(id);
  const KEY = 'mango.gate';
  // Ciphertext lives in its own file so the gate paints instantly instead of waiting
  // on a few MB of inlined payload. Start pulling it now, in the background, so it is
  // usually already here by the time anyone finishes typing.
  const payload = fetch('payload.json').then(r => {
    if(!r.ok) throw new Error('payload ' + r.status);
    return r.json();
  });
  async function tryOpen(pass){
    const P = await payload;
    const enc = new TextEncoder();
    const km = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b64d(P.salt), iterations:P.iter, hash:'SHA-256'},
      km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(P.iv)}, key, b64d(P.ct));
    return new TextDecoder().decode(pt);
  }
  function swap(html){ document.open(); document.write(html); document.close(); }
  async function attempt(pass, remember, silent){
    const btn = $('go'); btn.disabled = true; btn.textContent = 'Opening'; $('err').textContent = '';
    try {
      const html = await tryOpen(pass);
      if(remember){ try { localStorage.setItem(KEY, pass); } catch(e){} }
      swap(html);
    } catch(e){
      btn.disabled = false; btn.textContent = 'Open';
      if(!silent){
        $('err').textContent = 'Wrong passcode.';
        const c = $('f'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
        $('pw').select();
      } else { try { localStorage.removeItem(KEY); } catch(e){} }
    }
  }
  $('f').addEventListener('submit', e => {
    e.preventDefault(); const v = $('pw').value.trim(); if(v) attempt(v, $('rem').checked, false);
  });
  let saved = null; try { saved = localStorage.getItem(KEY); } catch(e){}
  if(saved) attempt(saved, false, true);
})();
</script>
</body>
</html>
